<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Perros y Gatos</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <div class="contenedor">
        <h1>🐶🐱 Clasificador de Perros y Gatos</h1>

        <p class="descripcion">
            Sube una imagen o usa la cámara para que la inteligencia artificial detecte si es un perro o un gato.
        </p>

        <div class="acciones">
            <div class="selector-archivo">
                <label for="imagenGaleria" class="boton archivo">Seleccionar imagen</label>
                <input type="file" id="imagenGaleria" accept="image/*">
                <input type="file" id="imagenCamara" accept="image/*" capture="environment">
            </div>
        </div>

        <div class="acciones inferior">
            <button id="btnCamara" type="button" class="boton camara">Usar cámara</button>
        </div>

        <div id="panelCamara" class="panel-camara oculto" aria-live="polite">
            <video id="videoCamara" autoplay playsinline muted></video>
            <div class="acciones-camara">
                <button id="btnTomarFoto" type="button" class="boton camara">Tomar foto</button>
                <button id="btnCerrarCamara" type="button" class="boton archivo">Cerrar</button>
            </div>
        </div>

        <canvas id="canvasFoto" class="oculto"></canvas>

        <img id="vistaPrevia" alt="Vista previa de la imagen">

        <button id="btnClasificar" disabled>
            Clasificar imagen
        </button>

        <p id="estado" class="estado">Cargando modelo...</p>
        <h2 id="resultado">Esperando imagen...</h2>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>
    <script src="app.js?v=20260907-3"></script>
</body>
</html>
